<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3566a8"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8882"/></marker>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #c9c7c0; stroke-width: 1.2; }
    .key { fill: #ffffff; stroke: #3566a8; stroke-width: 2; }
    .db  { fill: #f3f2ef; stroke: #a9a79f; stroke-width: 1.2; }
    .t   { font-size: 14px; font-weight: 600; fill: #1d1d1b; }
    .s   { font-size: 11.5px; fill: #55544f; }
    .n   { font-size: 11px; fill: #8a8882; }
    .lane{ font-size: 12px; font-weight: 600; fill: #6b6a66; letter-spacing: .04em; }
    .out { stroke: #3566a8; stroke-width: 1.8; fill: none; marker-end: url(#b); }
    .in  { stroke: #2f7d4f; stroke-width: 1.8; fill: none; marker-end: url(#g); }
    .rw  { stroke: #8a8882; stroke-width: 1.4; fill: none; marker-end: url(#k); marker-start: url(#k); }
    .rd  { stroke: #8a8882; stroke-width: 1.4; fill: none; marker-end: url(#k); }
  </style>
  <rect width="1240" height="640" fill="#fbfbfa"/>

  <!-- outbound lane -->
  <text class="lane" x="20" y="32">OUTBOUND — EVERY SECOND, ON EVERY WORKER</text>
  <rect x="410" y="58" width="590" height="146" rx="6" fill="none" stroke="#3566a8" stroke-dasharray="6 4" stroke-width="1.2"/>
  <text class="n" x="420" y="52" fill="#3566a8">safety boundary: nothing reaches a provider without a single-use permit</text>

  <rect class="box" x="20"  y="80" width="170" height="112" rx="4"/>
  <text class="t" x="32" y="104">1  Snapshot</text>
  <text class="s" x="32" y="126">free agents, ringing calls,</text>
  <text class="s" x="32" y="142">answer-rate history,</text>
  <text class="s" x="32" y="158">read from the database</text>

  <rect class="box" x="220" y="80" width="170" height="112" rx="4"/>
  <text class="t" x="232" y="104">2  Pacing engine</text>
  <text class="s" x="232" y="126">progressive | predictive</text>
  <text class="s" x="232" y="142">only returns a number:</text>
  <text class="s" x="232" y="158">“start 15 calls”</text>
  <text class="s" x="232" y="174">no DB handle, can't dial</text>

  <rect class="key" x="420" y="80" width="170" height="112" rx="4"/>
  <text class="t" x="432" y="104">3  Safety controller</text>
  <text class="s" x="432" y="126">re-reads DB in one write tx</text>
  <text class="s" x="432" y="142">pessimistic answer rate</text>
  <text class="s" x="432" y="158">approve · reduce · reject</text>
  <text class="s" x="432" y="174">or fall back to progressive</text>

  <rect class="box" x="620" y="80" width="170" height="112" rx="4"/>
  <text class="t" x="632" y="104">4  Call allocator</text>
  <text class="s" x="632" y="126">spends 1 permit per call</text>
  <text class="s" x="632" y="142">reserves agent + borrower</text>
  <text class="s" x="632" y="158">by compare-and-set</text>
  <text class="s" x="632" y="174">only caller of dial()</text>

  <rect class="box" x="820" y="80" width="170" height="112" rx="4"/>
  <text class="t" x="832" y="104">5  Provider router</text>
  <text class="s" x="832" y="126">circuit breaker each</text>
  <text class="s" x="832" y="142">fails over A ↔ B</text>
  <text class="s" x="832" y="158">timeout: ask the provider,</text>
  <text class="s" x="832" y="174">never assume it failed</text>

  <rect class="box" x="1030" y="80" width="190" height="112" rx="4"/>
  <text class="t" x="1042" y="104">Telecom providers</text>
  <text class="s" x="1042" y="126">A: fast, reliable</text>
  <text class="s" x="1042" y="142">B: slow, timeouts,</text>
  <text class="s" x="1042" y="158">duplicate and</text>
  <text class="s" x="1042" y="174">out-of-order events</text>

  <path class="out" d="M190 136 H218"/>
  <path class="out" d="M390 136 H418"/>
  <path class="out" d="M590 136 H618"/>
  <path class="out" d="M790 136 H818"/>
  <path class="out" d="M990 136 H1028"/>

  <!-- database -->
  <rect class="db" x="20" y="272" width="970" height="92" rx="4"/>
  <text class="t" x="36" y="298">Database — the only shared state  <tspan class="s" font-weight="400">(SQLite here, Postgres-shaped SQL)</tspan></text>
  <text class="s" x="36" y="322">agents · borrowers · calls · permits · call_events (inbox) · decisions · safety_state</text>
  <text class="s" x="36" y="342">unique indexes: one live call per agent and one per borrower — true even if the code is wrong</text>

  <path class="rd" d="M105 270 V194"/>
  <text class="n" x="112" y="238">read</text>
  <path class="rw" d="M505 194 V270"/>
  <text class="n" x="512" y="238">one write tx, mints permits</text>
  <path class="rw" d="M705 194 V270"/>
  <text class="n" x="712" y="238">compare-and-set</text>

  <!-- inbound lane -->
  <text class="lane" x="20" y="414">INBOUND — PROVIDER EVENTS</text>
  <path class="in" d="M1125 192 V438"/>
  <text class="n" x="1117" y="232" text-anchor="end">webhooks:</text>
  <text class="n" x="1117" y="247" text-anchor="end">RINGING, ANSWERED,</text>
  <text class="n" x="1117" y="262" text-anchor="end">COMPLETED, FAILED</text>

  <rect class="box" x="1030" y="440" width="190" height="112" rx="4"/>
  <text class="t" x="1042" y="464">6  Webhook inbox</text>
  <text class="s" x="1042" y="486">insert-or-ignore on</text>
  <text class="s" x="1042" y="502">provider event id</text>
  <text class="s" x="1042" y="518">exact duplicates dropped</text>
  <text class="s" x="1042" y="534">kept if a worker crashes</text>

  <rect class="box" x="790" y="440" width="200" height="112" rx="4"/>
  <text class="t" x="802" y="464">7  Event processor</text>
  <text class="s" x="802" y="486">state only moves forward</text>
  <text class="s" x="802" y="502">finished calls stay finished</text>
  <text class="s" x="802" y="518">late or repeated event</text>
  <text class="s" x="802" y="534">= no change</text>

  <rect class="box" x="550" y="440" width="210" height="112" rx="4"/>
  <text class="t" x="562" y="464">8  Answered call</text>
  <text class="s" x="562" y="486">grab a free agent (compare-and-set)</text>
  <text class="s" x="562" y="502">none within 2 s: play the</text>
  <text class="s" x="562" y="518">compliance message, retry that</text>
  <text class="s" x="562" y="534">borrower with an agent reserved</text>

  <rect class="box" x="300" y="440" width="220" height="112" rx="4"/>
  <text class="t" x="312" y="464">Housekeeper (any worker)</text>
  <text class="s" x="312" y="486">crashed worker = lease expires,</text>
  <text class="s" x="312" y="502">another worker recovers its calls</text>
  <text class="s" x="312" y="518">unsure if a dial went out?</text>
  <text class="s" x="312" y="534">ask the provider by our call id</text>

  <path class="in" d="M1030 496 H992"/>
  <path class="in" d="M790 496 H762"/>
  <path class="rw" d="M1080 438 V320 H992"/>
  <path class="rw" d="M890 366 V438"/>
  <path class="rw" d="M655 366 V438"/>
  <path class="rw" d="M410 366 V438"/>

  <!-- legend -->
  <text class="s" x="20" y="460" font-weight="600" fill="#1d1d1b">Reading this</text>
  <line x1="20" y1="480" x2="48" y2="480" stroke="#3566a8" stroke-width="2"/><text class="s" x="56" y="484">placing calls</text>
  <line x1="20" y1="500" x2="48" y2="500" stroke="#2f7d4f" stroke-width="2"/><text class="s" x="56" y="504">provider events</text>
  <line x1="20" y1="520" x2="48" y2="520" stroke="#8a8882" stroke-width="1.4"/><text class="s" x="56" y="524">database read / write</text>
  <text class="s" x="20" y="546">every write is conditional:</text>
  <text class="s" x="20" y="562">two workers, same row,</text>
  <text class="s" x="20" y="578">one wins, one gets 0 rows</text>

  <text class="n" x="20" y="618">One worker shown. Any number of workers run this same loop against the same database; nothing else is shared — no queue, no cache, no coordinator.</text>
</svg>
